<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Farmacia Bayer | Gestión</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23102d26' stroke='%234ade80' stroke-width='2'/><path d='M16 7v18M7 16h18' stroke='%23f4f8f5' stroke-width='2.2' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="ico-brand">
            <circle cx="12" cy="12" r="9.5"/>
            <path d="M12 5.5v13M5.5 12h13"/>
          </svg>
        </div>
        <div>
          <div class="brand-kicker">BAYER</div>
          <div class="brand-title">Farmacia</div>
        </div>
        <button class="sidebar-close" id="sidebar-close" aria-label="Cerrar menú">&times;</button>
      </div>

      <div class="sidebar-section-label">Módulos</div>
      <nav id="nav" class="sidebar-nav" aria-label="Módulos del sistema"></nav>

      <hr class="sidebar-divider">

      <div class="sidebar-footer">
        <details class="sidebar-settings" id="sidebar-settings">
          <summary>
            <span class="settings-summary-title">
              <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
              <span>Configuraciones</span>
            </span>
          </summary>
          <div class="settings-body">
            <label class="switch-row" for="dark-mode-toggle">
              <span>Modo oscuro</span>
              <input type="checkbox" id="dark-mode-toggle">
              <span class="switch-slider"></span>
            </label>
          </div>
        </details>

        <div class="conn-box" id="conn-box">
          <span class="conn-dot" id="conn-dot"></span>
          <div>
            <div class="conn-title" id="conn-title">Conexión directa a Oracle</div>
            <div class="conn-sub" id="conn-sub">Oracle APEX · ORDS REST</div>
          </div>
        </div>
        <button type="button" id="btn-refresh" class="btn-sidebar-refresh">
          <svg viewBox="0 0 24 24" class="ico"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          <span>Actualizar datos</span>
        </button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-header">
        <div class="top-header-left">
          <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">&#9776;</button>
          <div>
            <h1>Farmacia Bayer</h1>
            <p class="top-caption">Gestión de medicamentos, inventario, lotes y pedidos conectados a Oracle Database</p>
          </div>
        </div>
        <div class="top-header-right" id="header-actions"></div>
      </header>

      <main id="view" class="content-view">
        <div class="loading-state">
          <div class="spinner"></div>
          <p class="muted">Conectando con Oracle Database y cargando módulo…</p>
        </div>
      </main>
    </div>
  </div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
